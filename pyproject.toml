[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poster-http"
version = "0.2.0"
description = "Recorder, declarative HTTP automation engine and independent content generator"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "pydantic>=2.9,<3", "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5", "cryptography>=43", "google-auth[requests]>=2.35,<3",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
recorder = ["playwright>=1.48,<2"]
maker = ["playwright>=1.48,<2", "PySide6==6.12.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8"]
notebook = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6.29,<8"]

[project.scripts]
poster = "poster.cli:main"

[tool.setuptools.packages.find]
include = ["poster*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.setuptools.package-data]
"poster.recognition" = ["data/*.json"]
