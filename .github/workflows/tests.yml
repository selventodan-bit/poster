name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --diff .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb libtk8.6
      - run: xvfb-run -a uv run --no-sync python -m pytest -q --junitxml=.poster/python-tests.xml
      - name: Publish full regression counts
        if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/python-tests.xml .poster/python-tests-report.json --label 'Linux Python ${{ matrix.python }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-tests-${{ matrix.python }}
          path: .poster/python-tests-report.json
          include-hidden-files: true
          if-no-files-found: warn
  phpbb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, mbstring, xml
          tools: composer:v2
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python scripts/run_phpbb_ci.py
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
  windows-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_windows_package.py --output release
      - uses: actions/upload-artifact@v4
        with:
          name: poster-windows-source
          path: release/
          if-no-files-found: error
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[recorder]" -c requirements-recorder.txt -r requirements-windows-build.txt
      - name: Build portable windowed executable without a bundled browser
        run: python scripts/build_windows_app.py --output release
      - uses: actions/upload-artifact@v4
        with:
          name: poster-windows
          path: release/
          if-no-files-found: error
  windows-recorder:
    needs: [windows-source, windows-package]
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: '${{ github.workspace }}/Poster Проверка с пробелами/.poster/browser-cache'
      EXPECTED_POSTER_COMMIT: '${{ github.event.pull_request.head.sha || github.sha }}'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: poster-windows-source
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: poster-windows
          path: app-download
      - name: Verify archive and extract into a fresh Unicode path
        shell: pwsh
        run: |
          $expected = (Get-Content download/poster-windows.sha256).Split(' ')[0]
          if ((Get-FileHash download/poster-windows.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'ZIP checksum mismatch' }
          Expand-Archive download/poster-windows.zip 'Poster Проверка с пробелами'
          $appExpected = (Get-Content app-download/poster-windows.sha256).Split(' ')[0]
          if ((Get-FileHash app-download/poster-windows.zip -Algorithm SHA256).Hash.ToLower() -ne $appExpected) { throw 'App ZIP checksum mismatch' }
          Expand-Archive app-download/poster-windows.zip 'Portable Poster Проверка'
          $env:POSTER_PYTHON = (Get-Command python).Source
          "POSTER_PYTHON=$env:POSTER_PYTHON" >> $env:GITHUB_ENV
      - name: Source launcher explicitly installs dependencies and reuses installed Chrome
        working-directory: Poster Проверка с пробелами
        shell: cmd
        run: start_recorder.cmd --check --accept-dependencies
      - name: Reuse existing environment
        working-directory: Poster Проверка с пробелами
        shell: cmd
        run: start_recorder.cmd --check --accept-dependencies
      - name: Repair a stale installation via the same launcher
        working-directory: Poster Проверка с пробелами
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pip uninstall --yes poster-http
          if errorlevel 1 exit /b 1
          call start_recorder.cmd --check --accept-dependencies
          if errorlevel 1 exit /b 1
      - name: Invalid explicit Chromium produces a clear failure
        working-directory: Poster Проверка с пробелами
        shell: pwsh
        run: |
          $env:POSTER_CHROMIUM = 'C:\poster-browser-does-not-exist.exe'
          cmd /c 'start_recorder.cmd --check --accept-dependencies'
          if ($LASTEXITCODE -eq 0) { throw 'Invalid Chromium accepted' }
          Remove-Item Env:POSTER_CHROMIUM
          exit 0
      - name: Windows Chromium to HTTP and new process Runtime (topic)
        working-directory: Poster Проверка с пробелами
        run: .venv/Scripts/python.exe scripts/check_windows_e2e.py --output .poster/windows-topic
      - name: Windows body-only service E2E and knowledge restart (reply)
        working-directory: Poster Проверка с пробелами
        run: .venv/Scripts/python.exe scripts/check_windows_e2e.py --case reply --output .poster/windows-reply
      - name: Install pytest for GUI and safety checks
        working-directory: Poster Проверка с пробелами
        run: .venv/Scripts/python.exe -m pip install pytest pytest-asyncio pywinauto==0.6.9 Pillow==11.3.0 psutil==6.1.1
      - name: Native Tk, clipboard and independent network regression checks
        id: native-tests
        working-directory: Poster Проверка с пробелами
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pytest -q tests/test_recorder_ui.py tests/test_recognition_protocol.py tests/test_user_readiness.py tests/test_desktop.py tests/test_maker.py tests/test_maker_stage2.py tests/test_maker_stage2_ui.py tests/test_maker_actions3.py --junitxml=.poster/windows-tests.xml
          $testExit = $LASTEXITCODE
          .venv/Scripts/python.exe scripts/summarize_pytest.py .poster/windows-tests.xml .poster/windows-tests-report.json
          exit $testExit
      - name: Full packaged GUI via real OS mouse keyboard and native dialogs
        if: ${{ !cancelled() && (success() || steps.native-tests.outcome == 'failure') }}
        working-directory: Poster Проверка с пробелами
        shell: pwsh
        run: |
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH
          .venv/Scripts/python.exe scripts/check_windows_gui.py --exe '../Portable Poster Проверка/Poster.exe' --output .poster/windows-gui
      - name: ProjectMaker packaged record edit debug save reopen through OS input
        if: ${{ !cancelled() && (success() || steps.native-tests.outcome == 'failure') }}
        working-directory: Poster Проверка с пробелами
        shell: pwsh
        run: |
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH -ErrorAction SilentlyContinue
          .venv/Scripts/python.exe scripts/check_maker_windows_gui.py --exe '../Portable Poster Проверка/Poster.exe' --output .poster/windows-maker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-${{ matrix.python }}
          path: |
            Poster Проверка с пробелами/.poster/windows-*/report.json
            Poster Проверка с пробелами/.poster/windows-tests-report.json
            Poster Проверка с пробелами/.poster/windows-gui/report.json
            Poster Проверка с пробелами/.poster/windows-gui/*.png
            Poster Проверка с пробелами/.poster/windows-maker/report.json
            Poster Проверка с пробелами/.poster/windows-maker/*.png
          include-hidden-files: true
          if-no-files-found: warn
  original-cms:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [mybb, smf, flarum]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python scripts/run_cms_ci.py --engine ${{ matrix.engine }} --output .poster/cms-ci
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
      - uses: actions/upload-artifact@v4
        with:
          name: original-${{ matrix.engine }}-report
          path: .poster/cms-ci/report.json
          include-hidden-files: true
          if-no-files-found: error
  maker-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Independent graph recorder and executor without Windows GUI
        run: uv run --no-sync python scripts/check_maker.py --output .poster/maker-headless
      - name: Stage2 variables loops breakpoints inspector and fresh-process replay
        run: uv run --no-sync python scripts/check_maker_stage2.py --output .poster/maker-stage2
      - name: Stage3B2 four committed examples without GUI or browser imports
        run: uv run --no-sync python scripts/check_maker_stage3b2.py --output .poster/maker-stage3b2
      - uses: actions/upload-artifact@v4
        with:
          name: maker-headless-report
          path: |
            .poster/maker-headless/report.json
            .poster/maker-stage2/report.json
            .poster/maker-stage3b2/report.json
          include-hidden-files: true
          if-no-files-found: error
  embedded-prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated prototype dependencies, excluded from portable app
        run: python -m pip install ".[recorder]" -c requirements-recorder.txt PySide6==6.12.0
      - name: Linux native rendering libraries
        if: runner.os == 'Linux'
        run: |
          python -m playwright install-deps chromium
          sudo apt-get install -y xvfb xauth dbus-daemon libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 libatomic1 libxtst6
      - name: Real embedded Qt browser with CDP on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -nolisten tcp" python scripts/prototype_embedded_browser.py --output .poster/embedded-prototype
      - name: Real embedded Qt browser with CDP on Windows
        if: runner.os == 'Windows'
        run: python scripts/prototype_embedded_browser.py --output .poster/embedded-prototype
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-prototype-${{ matrix.os }}
          path: |
            .poster/embedded-prototype/report.json
            .poster/embedded-prototype/embedded.png
            .poster/embedded-prototype/dependencies.json
          include-hidden-files: true
          if-no-files-found: error
  original-editors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/integration/editors/package-lock.json
      - run: npm ci --prefix scripts/integration/editors
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python scripts/check_original_editors.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-editors-report
          path: .poster/original-editors/report.json
          include-hidden-files: true
          if-no-files-found: error

  maker-browser-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POSTER_TEST_QT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,maker]" -c requirements-recorder.txt
      - if: runner.os == 'Linux'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb xauth dbus-daemon libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 libatomic1 libxtst6
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python -m pytest -q tests/test_maker_stage3a.py tests/test_maker_unified.py tests/test_dispatcher_qt.py --junitxml=.poster/provider-tests.xml
        env:
          POSTER_QT_TEST_NO_SANDBOX: '1'
      - if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_maker_stage3a.py tests/test_maker_unified.py tests/test_dispatcher_qt.py --junitxml=.poster/provider-tests.xml
      - name: Publish Qt regression counts
        if: always()
        run: python scripts/summarize_pytest.py .poster/provider-tests.xml .poster/provider-tests-report.json --label 'Qt ${{ runner.os }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-provider-${{ matrix.os }}
          path: .poster/provider-tests.xml
          include-hidden-files: true
          if-no-files-found: error
  maker-windows-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[maker]" -c requirements-recorder.txt -r requirements-windows-build.txt
      - run: python scripts/build_windows_app.py --embedded --output release
      - uses: actions/upload-artifact@v4
        with:
          name: poster-maker-windows
          path: release/
          if-no-files-found: error
      - name: Verify full ZIP in Unicode path and checksum
        shell: pwsh
        run: |
          $expected = (Get-Content release/poster-maker-windows.sha256).Split(' ')[0]
          if ((Get-FileHash release/poster-maker-windows.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Maker ZIP checksum mismatch' }
          Expand-Archive release/poster-maker-windows.zip 'Maker Проверка с пробелами'
      - run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0 psutil==6.1.1
      - name: Full shared runtime headless service lifecycle before GUI tests
        run: python scripts/check_dispatcher_frozen_shutdown.py --bundle 'Maker Проверка с пробелами' --output .poster/frozen-full-lifecycle
        env:
          EXPECTED_POSTER_COMMIT: '${{ github.sha }}'
          PYTHONUTF8: '1'
      - name: Packaged Qt Maker through real OS mouse and keyboard
        run: python scripts/check_unified_windows_gui.py --exe 'Maker Проверка с пробелами/Poster.exe' --output .poster/maker-qt-gui
        env:
          EXPECTED_POSTER_COMMIT: '${{ github.sha }}'
          PYTHONUTF8: '1'
      - name: Stage3B2 data HTTP files and nested projects through native Windows input
        run: python scripts/check_data_windows_gui.py --exe 'Maker Проверка с пробелами/Poster.exe' --output .poster/maker-data-gui
        env:
          EXPECTED_POSTER_COMMIT: '${{ github.sha }}'
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: maker-windows-data-graph
          path: .poster/maker-data-gui/*.postergraph.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: maker-windows-graph
          path: .poster/maker-qt-gui/windows-maker-demo.postergraph.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maker-qt-gui
          path: |
            .poster/maker-qt-gui/report.json
            .poster/maker-qt-gui/*.png
            .poster/maker-data-gui/report.json
            .poster/maker-data-gui/*.png
            .poster/frozen-full-lifecycle/report.json
          include-hidden-files: true
          if-no-files-found: error

  dispatcher-frozen-lifecycle:
    needs: windows-package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -c requirements-recorder.txt
      - uses: actions/download-artifact@v4
        with:
          name: poster-windows
          path: release
      - run: Expand-Archive release/poster-windows.zip 'Runtime Проверка'
        shell: pwsh
      - name: Frozen service idle, missing worker, and completed data job shutdown
        run: python scripts/check_dispatcher_frozen_shutdown.py --bundle 'Runtime Проверка' --output .poster/frozen-lifecycle
        env:
          EXPECTED_POSTER_COMMIT: '${{ github.sha }}'
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatcher-frozen-lifecycle
          path: .poster/frozen-lifecycle/report.json
          include-hidden-files: true
          if-no-files-found: warn

  dispatcher-windows-package:
    needs: maker-windows-package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[recorder]" -c requirements-recorder.txt pywinauto==0.6.9 Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: poster-maker-windows
          path: release
      - name: Check internal ZIP and extract the complete frozen distribution
        shell: pwsh
        run: |
          $expected = (Get-Content release/poster-maker-windows.sha256).Split(' ')[0]
          if ((Get-FileHash release/poster-maker-windows.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Dispatcher ZIP checksum mismatch' }
          Expand-Archive release/poster-maker-windows.zip 'Dispatcher Проверка с пробелами'
      - name: Native Windows Dispatcher GUI and frozen workers without Python on PATH
        run: python scripts/check_dispatcher_windows_gui.py --exe 'Dispatcher Проверка с пробелами/PosterDispatcher.exe' --output .poster/dispatcher-windows-gui
        env:
          EXPECTED_POSTER_COMMIT: '${{ github.sha }}'
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatcher-windows-gui
          path: |
            .poster/dispatcher-windows-gui/report.json
            .poster/dispatcher-windows-gui/*.png
          include-hidden-files: true
          if-no-files-found: error

  windows-graph-on-linux:
    needs: maker-windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: maker-windows-graph
          path: windows-graph
      - name: Execute the exact graph saved by frozen Windows Maker without Qt or Tk
        run: uv run --no-sync python scripts/check_windows_graph_linux.py windows-graph/windows-maker-demo.postergraph.json --output .poster/windows-graph-linux
      - uses: actions/download-artifact@v4
        with:
          name: maker-windows-data-graph
          path: windows-data
      - name: Execute all four exact Windows data graphs without GUI or browser imports
        run: uv run --no-sync python scripts/check_maker_stage3b2.py --windows-dir windows-data --output .poster/windows-data-linux
      - name: Exact Windows Maker graphs through independent Linux Dispatcher and subprocess workers
        run: uv run --no-sync python scripts/check_dispatcher.py --windows-dir windows-data --browser-graph windows-graph/windows-maker-demo.postergraph.json --output .poster/dispatcher-windows-linux
      - uses: actions/upload-artifact@v4
        with:
          name: windows-graph-linux-report
          path: |
            .poster/windows-graph-linux/report.json
            .poster/windows-data-linux/report.json
            .poster/dispatcher-windows-linux/report.json
          include-hidden-files: true
          if-no-files-found: error

  dispatcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: windows-latest, python: '3.11'}
          - {os: windows-latest, python: '3.12'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel with no GUI dependency
        run: python -m pip install ".[dev,recorder]" -c requirements-recorder.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Real subprocess queue concurrency crash secret and browser lifecycle tests
        run: python -m pytest -q tests/test_dispatcher_store.py tests/test_dispatcher_worker.py tests/test_dispatcher_service.py tests/test_dispatcher_cli.py tests/test_dispatcher_faults.py tests/test_dispatcher_host.py tests/test_dispatcher_launcher.py --junitxml=.poster/dispatcher-tests.xml
      - name: Public CLI executes the four saved projects
        run: python scripts/check_dispatcher.py --output .poster/dispatcher-demo
      - name: Publish dispatcher counts
        if: always()
        run: python scripts/summarize_pytest.py .poster/dispatcher-tests.xml .poster/dispatcher-tests-report.json --label 'Dispatcher ${{ matrix.os }} Python ${{ matrix.python }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatcher-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .poster/dispatcher-tests-report.json
            .poster/dispatcher-demo/report.json
          include-hidden-files: true
          if-no-files-found: error

  scheduler-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]"
      - name: UTC DST migrations atomic admission real service worker and secret boundaries
        run: python -m pytest -q tests/test_dispatcher_schedule_migration.py tests/test_dispatcher_schedules.py tests/test_dispatcher_schedule_recovery.py tests/test_dispatcher_autostart.py --junitxml=.poster/scheduler-tests.xml
      - name: Publish scheduler counts
        if: always()
        run: python scripts/summarize_pytest.py .poster/scheduler-tests.xml .poster/scheduler-tests-report.json --label 'Scheduler ${{ runner.os }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-source-${{ matrix.os }}
          path: .poster/scheduler-tests-report.json
          include-hidden-files: true
          if-no-files-found: error

  scheduler-windows-frozen:
    needs: maker-windows-package
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      EXPECTED_POSTER_COMMIT: '${{ github.event.pull_request.head.sha || github.sha }}'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pywinauto==0.6.9 Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: poster-maker-windows
          path: release
      - name: Verify and extract the exact full Windows ZIP
        shell: pwsh
        run: |
          $expected = (Get-Content release/poster-maker-windows.sha256).Split(' ')[0]
          if ((Get-FileHash release/poster-maker-windows.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Scheduler ZIP checksum mismatch' }
          Expand-Archive release/poster-maker-windows.zip 'Scheduler Проверка с пробелами'
      - name: Native schedule GUI closed-window execution real frozen worker history and restart
        id: schedule-gui
        run: python scripts/check_scheduler_windows_gui.py --exe 'Scheduler Проверка с пробелами/PosterDispatcher.exe' --output .poster/scheduler-windows-gui
      - name: Separate opt-in logon task test with mandatory task cleanup
        if: ${{ !cancelled() && (success() || steps.schedule-gui.outcome == 'failure') }}
        run: python scripts/check_scheduler_windows_autostart.py --bundle 'Scheduler Проверка с пробелами' --output .poster/scheduler-windows-autostart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-windows-frozen
          path: |
            .poster/scheduler-windows-gui/report.json
            .poster/scheduler-windows-gui/*.png
            .poster/scheduler-windows-autostart/report.json
          include-hidden-files: true
          if-no-files-found: error

  remote-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev]"
      - name: Pinned identities crypto protocol routing migrations risk fence and revoked access
        run: python -m pytest -q tests/test_remote_protocol.py tests/test_remote_registry.py --junitxml=.poster/remote-protocol.xml
      - if: always()
        run: python scripts/summarize_pytest.py .poster/remote-protocol.xml .poster/remote-protocol-report.json --label 'Remote protocol ${{ runner.os }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-protocol-${{ matrix.os }}
          path: .poster/remote-protocol-report.json
          include-hidden-files: true
          if-no-files-found: error

  remote-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,recorder]"
      - run: python -m playwright install --with-deps chromium
      - name: Real isolated TLS relay Controller Agent subprocesses browser and crash recovery
        run: python -m pytest -q tests/remote_linux_e2e.py --junitxml=.poster/remote-linux.xml
      - if: always()
        run: python scripts/summarize_pytest.py .poster/remote-linux.xml .poster/remote-linux-report.json --label 'Remote Linux real processes TLS GraphRunner recovery'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-linux-e2e
          path: .poster/remote-linux-report.json
          include-hidden-files: true
          if-no-files-found: error

  remote-windows-graphs:
    needs: maker-windows-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTER_REMOTE_WINDOWS_DIR: windows-data
      POSTER_REMOTE_BROWSER_GRAPH: windows-graph/windows-maker-demo.postergraph.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,recorder]"
      - run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: maker-windows-data-graph
          path: windows-data
      - uses: actions/download-artifact@v4
        with:
          name: maker-windows-graph
          path: windows-graph
      - name: Exact Windows-generated graphs through Linux Controller TLS relay and Linux Agent
        run: python -m pytest -q -s tests/remote_windows_graph.py --junitxml=.poster/remote-windows-graphs.xml
      - if: always()
        run: python scripts/summarize_pytest.py .poster/remote-windows-graphs.xml .poster/remote-windows-graphs-report.json --label 'Windows graph format to Linux remote Agent; both protocol endpoints on Linux'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-windows-graphs
          path: .poster/remote-windows-graphs-report.json
          include-hidden-files: true
          if-no-files-found: error
