name: stage5d-execution-portability
on:
  push:
    branches: [codex/poster-5d-execution-portability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra recorder --extra notebook
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Private sessions, all proxy backends, directory analysis, readiness and large encrypted data recovery
        run: uv run --no-sync python -m pytest -q tests/test_portability_sessions.py tests/test_portability_permissions.py tests/test_portability_network.py tests/test_portability_resources.py tests/test_portability_readiness.py --junitxml=.poster/portability.xml
      - if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/portability.xml .poster/portability-report.json --label 'Stage 5D portability and private recovery'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portability-${{ matrix.os }}
          path: .poster/portability-report.json
          include-hidden-files: true
          if-no-files-found: error
  five-browsers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra recorder
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Five actual browser processes plus five original native Worker processes
        run: uv run --no-sync python -m pytest -q tests/portability_browser_instances.py tests/cloud_browser_instances.py --junitxml=.poster/five-browsers.xml
      - if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/five-browsers.xml .poster/five-browsers-report.json --label 'Stage 5D five actual browsers and original Workers'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-browsers-${{ matrix.os }}
          path: |
            .poster/five-browsers-report.json
            .poster/portability-browser-public/
          include-hidden-files: true
          if-no-files-found: error
  qt-preparation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      POSTER_QT_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra maker
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1 libnss3
      - if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync python -m pytest -q tests/portability_qt_e2e.py --junitxml=.poster/preparation-qt.xml
      - if: runner.os == 'Windows'
        run: uv run --no-sync python -m pytest -q tests/portability_qt_e2e.py --junitxml=.poster/preparation-qt.xml
      - if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/preparation-qt.xml .poster/preparation-qt-report.json --label 'Stage 5D real Qt preparation'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparation-qt-${{ matrix.os }}
          path: |
            .poster/preparation-qt-report.json
            .poster/portability-qt-public/
          include-hidden-files: true
          if-no-files-found: error
