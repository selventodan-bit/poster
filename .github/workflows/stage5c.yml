name: stage5c-drive-cloud
on:
  push:
    branches: [codex/poster-5c-drive-cloud-multiworker, codex/poster-5d-execution-portability]
permissions:
  contents: read
jobs:
  pinned-launcher-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen --extra dev --extra recorder --extra notebook
      - name: Execute the shipped hash-pinned installer in a fresh environment, including Molab native filesystem
        run: uv run --no-sync python scripts/cloud/check_pinned_install.py --output .poster/cloud-install
      - name: Package reusable launchers, demo projects, guide and component SHA256
        run: uv run --no-sync python scripts/cloud/package_assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poster-cloud-launchers
          path: |
            release/cloud/
            .poster/cloud-install/pinned-install.json
          include-hidden-files: true
          if-no-files-found: error
  notebook-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra recorder --extra notebook
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Real notebook kernels, original subprocesses, encrypted results and safe replay refusal
        run: uv run --no-sync python -m pytest -q tests/test_cloud_runtime.py tests/cloud_notebook_runtimes.py tests/cloud_browser_instances.py --junitxml=.poster/cloud-notebook.xml
      - if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/cloud-notebook.xml .poster/cloud-notebook-report.json --label 'Stage 5C real notebook/browser processes'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-notebook-runtime
          path: .poster/cloud-notebook.xml
          include-hidden-files: true
          if-no-files-found: error
  provider-documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit official public docs, without provider credentials or paid operations
        run: python scripts/cloud/research_providers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5c-provider-documentation
          path: .poster/stage5c-provider-docs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  cloud-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev --extra recorder
      - name: Controlled Drive protocol, immutable resources, real loopback OAuth and OS key store
        run: uv run --no-sync python -m pytest -q tests/test_cloud_storage.py tests/test_cloud_auth.py --junitxml=.poster/cloud-core.xml
      - if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/cloud-core.xml .poster/cloud-core-report.json --label 'Stage 5C Drive/OAuth ${{ runner.os }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-storage-${{ matrix.os }}
          path: .poster/cloud-core.xml
          include-hidden-files: true
          if-no-files-found: error
  cloud-qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      POSTER_QT_TEST_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev --extra maker
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-daemon libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 libatomic1 libxtst6
      - if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a uv run --no-sync python -m pytest -q tests/cloud_qt_e2e.py --junitxml=.poster/cloud-qt.xml
      - if: runner.os == 'Windows'
        run: uv run --no-sync python -m pytest -q tests/cloud_qt_e2e.py --junitxml=.poster/cloud-qt.xml
      - if: always()
        run: uv run --no-sync python scripts/summarize_pytest.py .poster/cloud-qt.xml .poster/cloud-qt-report.json --label 'Stage 5C Qt ${{ runner.os }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-qt-${{ matrix.os }}
          path: .poster/cloud-qt.xml
          include-hidden-files: true
          if-no-files-found: error
