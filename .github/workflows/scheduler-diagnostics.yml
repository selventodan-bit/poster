name: scheduler-diagnostics
on:
  push:
    branches: [codex/poster-4b2-scheduler-monitoring]
jobs:
  frozen-gui-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_POSTER_COMMIT: '9b5b68f18760dcfc31880d4a415b14f65b0e10f6'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pywinauto==0.6.9 Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          name: poster-maker-windows
          path: release
          run-id: 40233862862
          github-token: ${{ github.token }}
      - run: Expand-Archive release/poster-maker-windows.zip 'Diagnostic Full'
        shell: pwsh
      - name: Diagnose native input against the prior verified build without rebuilding it
        run: python scripts/check_scheduler_windows_gui.py --exe 'Diagnostic Full/PosterDispatcher.exe' --output .poster/scheduler-diagnosis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-diagnosis
          path: |
            .poster/scheduler-diagnosis/report.json
            .poster/scheduler-diagnosis/*.png
          include-hidden-files: true
          if-no-files-found: error
